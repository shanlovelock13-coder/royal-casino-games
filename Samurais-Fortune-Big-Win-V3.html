#royal-win-burst .royal-win-caption{text-align:center;color:#fff5c3;font:bold clamp(33px,9vw,75px) Georgia,serif;letter-spacing:.04em;text-shadow:0 2px 2px #703700,0 0 15px #ffb700,0 0 35px #f80;animation:royalWinPop .6s cubic-bezier(.15,1.4,.4,1) both;}
#royal-win-burst .royal-win-caption small{display:block;font:800 clamp(17px,4vw,29px) system-ui,sans-serif;color:#fff;margin-top:8px;text-shadow:0 0 15px #ff9b00}
#royal-win-burst .royal-spark{position:absolute;top:50%;left:50%;width:7px;height:7px;background:#fff5b5;box-shadow:0 0 12px 4px #ffb600;border-radius:50%;animation:royalSpark 1.7s ease-out both;transform:rotate(var(--a)) translateY(-15px)}
@keyframes royalSpark{to{transform:rotate(var(--a)) translateY(calc(-1 * var(--d)));opacity:0}}
@keyframes royalWinPop{from{transform:scale(.45);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes royalWinFade{0%{opacity:0}12%,68%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.royal-win-lit,#royal-win-burst.active,#royal-win-burst .royal-win-caption,#royal-win-burst .royal-spark{animation:none!important}}
</style>
<script id="royal-big-win-script">
/* Purely visual celebration, invoked only after a spin settles. Threshold: 10x bet. */
(function(){
let winTimer;
window.royalBigWin=function(amount,stake){
  if(!Number.isFinite(amount)||!Number.isFinite(stake)||stake<=0||amount<stake*10)return;
  let burst=document.getElementById('royal-win-burst');
  if(!burst){burst=document.createElement('div');burst.id='royal-win-burst';document.body.appendChild(burst)}
  clearTimeout(winTimer);burst.classList.remove('active');
  const isMega=amount>=stake*25;
  const label=isMega?'MEGA WIN!':'BIG WIN!';
  const caption=document.createElement('div');caption.className='royal-win-caption';caption.textContent=label;
  const coins=document.createElement('small');coins.textContent=Math.round(amount).toLocaleString()+' COINS';caption.appendChild(coins);
  burst.replaceChildren(caption);
  for(let i=0;i<28;i++){
    const s=document.createElement('span');s.className='royal-spark';s.style.setProperty('--a',(i*360/28)+'deg');s.style.setProperty('--d',(120+(i%5)*30)+'px');burst.appendChild(s)
  }
  const reel=document.querySelector('#reels')||document.querySelector('.reels')||document.querySelector('.reel-frame')||document.querySelector('.reelbox')||document.querySelector('.machine');
  if(reel){reel.classList.remove('royal-win-lit');void reel.offsetWidth;reel.classList.add('royal-win-lit')}
  void burst.offsetWidth;burst.classList.add('active');
  winTimer=setTimeout(()=>{burst.classList.remove('active');if(reel)reel.classList.remove('royal-win-lit')},2850);
};
})();
</script>

</body></html>
