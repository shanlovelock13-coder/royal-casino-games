let balance=10000,bet=50,free=0,bonusWin=0,spinning=false,music=false,audio=null,grid=[];const $=id=>document.getElementById(id);const fmt=n=>Math.floor(n).toLocaleString('en-GB');
function pick(){let n=Math.random()*symbols.reduce((a,s)=>a+s.weight,0);for(const s of symbols){n-=s.weight;if(n<0)return s}return symbols[0]}
function makeGrid(){return Array.from({length:15},pick)}
function draw(wins=[]){$('reels').innerHTML='';grid.forEach((s,i)=>{const c=document.createElement('div');c.className='cell '+(s.id==='scatter'?'scatter ':s.id==='wild'?'wild ':'')+(wins.includes(i)?'win':'');const v=document.createElement('span');v.className='symbol sym-'+s.id;v.style.backgroundImage='url('+art[s.id]+')';c.append(v);$('reels').append(c)})}
function update(){ $('balance').textContent=fmt(balance);$('bet').textContent=fmt(bet);$('bonuslabel').textContent=free?'BONUS WIN':'LAST WIN';$('win').textContent=fmt(free?bonusWin:lastWin);$('spin').textContent=free?'FREE SPIN':'SPIN';$('minus').disabled=$('plus').disabled=spinning||free>0;$('spin').disabled=spinning||(!free&&balance<bet)}let lastWin=0;
